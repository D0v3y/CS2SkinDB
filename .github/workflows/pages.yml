name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # Weekly refresh so new cases and collections show up without a commit.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Refresh dataset from upstream
        if: github.event_name != 'push'
        run: node scripts/build-data.mjs
      - name: Test
        run: npm test
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html assets data _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
